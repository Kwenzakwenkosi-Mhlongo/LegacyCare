name: Build and deploy ASP.Net Core app to Azure Web App - legacycare-api-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build legacycare_backend/legacycare_backend/legacycare_backend.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish legacycare_backend/legacycare_backend/legacycare_backend.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D55E7C8D36A64F79ABA03C4676D3B500 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_76AE2630CC9A4B74AEEE74BBE78DB6B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_753D9B03FDCC4A7189241DD51FC967D9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'legacycare-api-2026'
          slot-name: 'Production'
          package: .
