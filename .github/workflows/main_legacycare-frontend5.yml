name: Build and deploy Next.js app to Azure Web App - legacycare-frontend5

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: Web/legacycare_website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: Web/legacycare_website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Check Next.js build
        run: |
          echo "Checking .next..."
          ls -la
          test -d .next
          echo ".next folder exists"

      - name: Check Next.js installation
        run: |
          echo "Checking Next.js installation..."
          npm list next
          test -f node_modules/.bin/next
          echo "Next.js executable found"

      - name: Create deployment package
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf deploy
          mkdir -p deploy

          echo "Copying Next.js build..."

          cp -r Web/legacycare_website/.next deploy/.next
          cp -r Web/legacycare_website/public deploy/public
          cp Web/legacycare_website/package.json deploy/package.json
          cp Web/legacycare_website/package-lock.json deploy/package-lock.json
          cp Web/legacycare_website/next.config.ts deploy/next.config.ts

          echo "Installing production dependencies..."

          cd deploy
          npm ci --omit=dev

          echo "Deployment package contents:"
          ls -la

          echo "Checking .next:"
          test -d .next
          echo ".next exists"

          echo "Checking Next.js:"
          npm list next

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Check downloaded package
        run: |
          echo "Downloaded deployment package:"
          ls -la deploy

          echo "Checking .next:"
          test -d deploy/.next

          echo "Checking package.json:"
          test -f deploy/package.json

          echo "Checking node_modules:"
          test -d deploy/node_modules

          echo "Deployment package is ready"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E543B19629A14EB8A4802DD750B682DB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE1A42DEAA8346A5B9A6240CC9DFF94B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5738A6BE0644D56A7DB71C7FED67D04 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: legacycare-frontend5
          slot-name: Production
          package: ./deploy