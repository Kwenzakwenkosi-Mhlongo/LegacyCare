name: Build and deploy Next.js app to Azure Web App - legacycare-frontend5

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Web/legacycare_website/package-lock.json

      - name: Install dependencies
        working-directory: Web/legacycare_website
        run: npm ci

      - name: Build Next.js application
        working-directory: Web/legacycare_website
        run: npm run build

      - name: Verify Next.js installation
        working-directory: Web/legacycare_website
        run: |
          echo "Checking Next.js installation..."
          npm list next
          test -f node_modules/.bin/next
          echo "Next.js executable found."

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Web/legacycare_website/package-lock.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E543B19629A14EB8A4802DD750B682DB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE1A42DEAA8346A5B9A6240CC9DFF94B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5738A6BE0644D56A7DB71C7FED67D04 }}

      - name: Deploy source to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'legacycare-frontend5'
          slot-name: 'Production'
          package: ./Web/legacycare_website