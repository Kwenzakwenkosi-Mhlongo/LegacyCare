name: Build and deploy Next.js app to Azure Web App - legacycare-frontend5

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: Web/legacycare_website/package-lock.json

      - name: Install dependencies
        working-directory: Web/legacycare_website
        run: npm ci

      - name: Build Next.js
        working-directory: Web/legacycare_website
        run: npm run build

      - name: Check standalone build
        working-directory: Web/legacycare_website
        run: |
          echo "Checking standalone build..."

          if [ ! -f ".next/standalone/server.js" ]; then
            echo "ERROR: .next/standalone/server.js does not exist!"
            exit 1
          fi

          echo "server.js FOUND"

      - name: Create deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy

          echo "Copying standalone application..."

          cp -r Web/legacycare_website/.next/standalone/. ./deploy/

          echo "Copying static files..."

          mkdir -p deploy/.next/static
          cp -r Web/legacycare_website/.next/static/. ./deploy/.next/static/

          echo "Copying public files..."

          if [ -d "Web/legacycare_website/public" ]; then
            cp -r Web/legacycare_website/public ./deploy/public
          fi

          echo "================================="
          echo "FINAL DEPLOYMENT PACKAGE"
          echo "================================="

          ls -la deploy

          echo "Checking server.js..."

          if [ ! -f "deploy/server.js" ]; then
            echo "ERROR: server.js missing!"
            exit 1
          fi

          echo "server.js FOUND"

          echo "Checking .next..."

          if [ ! -d "deploy/.next" ]; then
            echo "ERROR: .next missing!"
            exit 1
          fi

          echo ".next FOUND"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          include-hidden-files: true

  deploy:

    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Verify deployment package
        run: |
          echo "================================="
          echo "DOWNLOADED DEPLOYMENT PACKAGE"
          echo "================================="

          ls -la deploy

          if [ ! -f "deploy/server.js" ]; then
            echo "ERROR: server.js missing!"
            exit 1
          fi

          echo "server.js EXISTS"

          if [ ! -d "deploy/.next" ]; then
            echo "ERROR: .next missing!"
            exit 1
          fi

          echo ".next EXISTS"

          echo "Deployment package is valid."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E543B19629A14EB8A4802DD750B682DB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE1A42DEAA8346A5B9A6240CC9DFF94B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5738A6BE0644D56A7DB71C7FED67D04 }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: legacycare-frontend5
          slot-name: Production
          package: ./deploy