name: Build and deploy Next.js app to Azure Web App - legacycare-frontend5

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: Web/legacycare_website/package-lock.json

      - name: Install dependencies
        working-directory: Web/legacycare_website
        run: npm ci

      - name: Build Next.js
        working-directory: Web/legacycare_website
        run: npm run build

      - name: Verify Next.js build
        working-directory: Web/legacycare_website
        run: |
          echo "================================="
          echo "CHECKING NEXT.JS BUILD"
          echo "================================="

          pwd
          ls -la

          if [ ! -d ".next" ]; then
            echo "ERROR: .next folder does not exist!"
            exit 1
          fi

          echo ".next folder EXISTS"

      - name: Create deployment package
        run: |
          echo "================================="
          echo "CREATING DEPLOYMENT PACKAGE"
          echo "================================="

          rm -rf deploy
          mkdir -p deploy

          cp -r Web/legacycare_website/.next deploy/.next
          cp -r Web/legacycare_website/public deploy/public

          cp Web/legacycare_website/package.json deploy/package.json
          cp Web/legacycare_website/package-lock.json deploy/package-lock.json
          cp Web/legacycare_website/next.config.ts deploy/next.config.ts

          echo "================================="
          echo "FINAL DEPLOYMENT PACKAGE"
          echo "================================="

          ls -la deploy

          if [ ! -d "deploy/.next" ]; then
            echo "ERROR: .next missing!"
            exit 1
          fi

          if [ ! -f "deploy/package.json" ]; then
            echo "ERROR: package.json missing!"
            exit 1
          fi

          if [ ! -f "deploy/package-lock.json" ]; then
            echo "ERROR: package-lock.json missing!"
            exit 1
          fi

          echo ".next FOUND"
          echo "package.json FOUND"
          echo "package-lock.json FOUND"

          echo "Checking that node_modules is NOT included..."

          if [ -d "deploy/node_modules" ]; then
            echo "ERROR: node_modules should not be deployed!"
            exit 1
          fi

          echo "node_modules NOT included"
          echo "Package is ready for Azure."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          include-hidden-files: true

  deploy:

    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Verify downloaded package
        run: |
          echo "================================="
          echo "DOWNLOADED DEPLOYMENT PACKAGE"
          echo "================================="

          ls -la deploy

          if [ ! -d "deploy/.next" ]; then
            echo "ERROR: .next is missing!"
            exit 1
          fi

          if [ ! -f "deploy/package.json" ]; then
            echo "ERROR: package.json is missing!"
            exit 1
          fi

          if [ ! -f "deploy/package-lock.json" ]; then
            echo "ERROR: package-lock.json is missing!"
            exit 1
          fi

          if [ -d "deploy/node_modules" ]; then
            echo "ERROR: node_modules is included!"
            exit 1
          fi

          echo ".next EXISTS"
          echo "package.json EXISTS"
          echo "package-lock.json EXISTS"
          echo "node_modules NOT included"
          echo "Deployment package is valid."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E543B19629A14EB8A4802DD750B682DB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE1A42DEAA8346A5B9A6240CC9DFF94B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5738A6BE0644D56A7DB71C7FED67D04 }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: legacycare-frontend5
          slot-name: Production
          package: ./deploy