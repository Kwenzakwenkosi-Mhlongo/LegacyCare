services:
  backend:
    build:
      context: ./legacycare_backend/legacycare_backend
      dockerfile: Dockerfile

    container_name: legacycare_backend

    ports:
      - "5224:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "${DATABASE_CONNECTION_STRING}"

      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "LegacyCareAPI"
      JwtSettings__Audience: "LegacyCareClient"
      JwtSettings__ExpiryMinutes: "1440"

    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./Web/legacycare_website
      dockerfile: Dockerfile

    container_name: legacycare_web

    ports:
      - "3000:3000"

    depends_on:
      - backend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: legacycare_sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - legacycare_sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  legacycare_sql_data: